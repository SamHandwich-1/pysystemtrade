# Mini-portfolio: EWMAC + carry; estimated forecast weights/FDM; fixed instrument weights.
percentage_vol_target: 20
notional_trading_capital: 250000
base_currency: "USD"
instruments:
  - SOFR
  - US10
  - CORN
  - SP500_micro
trading_rules:
  ewmac8:
     function: systems.provided.rules.ewmac.ewmac_forecast_with_defaults
     data: data.daily_prices
     other_args:
         Lfast: 8
         Lslow: 32
     forecast_scalar: 5.3
  ewmac32:
     function: systems.provided.rules.ewmac.ewmac_forecast_with_defaults
     other_args:
         Lfast: 32
         Lslow: 128
     forecast_scalar: 2.65
  carry:
     function: systems.provided.rules.carry.carry
     data:
         - rawdata.raw_carry
     other_args:
         smooth_days: 90
     forecast_scalar: 30
use_forecast_weight_estimates: True
use_forecast_div_mult_estimates: True
forecast_weight_estimate:
  method: one_period
instrument_weights:
     SOFR: 0.4
     US10: 0.1
     CORN: 0.3
     SP500_micro: 0.2
instrument_div_multiplier: 1.5
